<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>معركة العناصر - سهلة وممتعة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#0a0e18;overflow:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(at 50% 0%, #1e3a5a 0%, #0a0e18 70%)}
.logo{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#000;border:2px solid #F2A900;border-radius:50px;padding:6px 16px;color:#F2A900;font-weight:900;font-size:12px;z-index:10;box-shadow:0 0 20px #F2A90088}
.score{position:fixed;top:10px;right:10px;background:#000a;border-radius:12px;padding:8px 12px;color:#fff;font-weight:900;font-size:13px;z-index:10}
.island{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:320px;height:320px;background:radial-gradient(circle at 30% 30%, #1a2f4a, #0f1d35);border:3px solid #ffffff15;border-radius:50%;box-shadow:0 0 80px #000, inset 0 0 40px #000}
.crate{position:absolute;width:64px;height:64px;background:linear-gradient(#F2A900,#ff8c00);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#000;cursor:pointer;animation:float 2s infinite;box-shadow:0 6px 0 #b36e00, 0 10px 20px #0008;transition:.2s}
.crate:active{transform:scale(.9)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.card{background:#141928;border:2px solid #F2A900;border-radius:20px;padding:18px;max-width:340px;width:100%;text-align:center;color:#fff;animation:pop .3s}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.btn{width:100%;height:48px;border-radius:12px;border:none;font-weight:900;font-size:14px;margin-top:8px;cursor:pointer}
.confetti{position:fixed;top:-10px;width:8px;height:8px;pointer-events:none;z-index:30}
</style>
</head>
<body>
<div class="bg"></div>
<div class="logo">🏝️ Fe VS O - BATTLEGROUNDS</div>
<div class="score">⭐ <span id="sc">0</span> | 📦 <span id="cnt">0/6</span></div>
<div class="island" id="island"></div>
<div class="modal" id="md"><div class="card" id="cd"></div></div>

<script>
const ELS=[
{s:'Fe',n:'الحديد',m:true,j:'ده بيتعمل منه باب الشقة! 🔑'},
{s:'Al',n:'الألومنيوم',m:true,j:'علبة البيبسي دي منه! 🥫'},
{s:'Cu',n:'النحاس',m:true,j:'سلك الشاحن بتاعك! 🔌'},
{s:'Au',n:'الذهب',m:true,j:'ده بتاع الشبكة! 💍'},
{s:'S',n:'الكبريت',m:false,j:'ريحته وحشة زي البيض الفاسد! 🤢'},
{s:'O',n:'الأكسجين',m:false,j:'بتتنفسه كل ثانية! 😮‍💨'},
{s:'C',n:'الكربون',m:false,j:'قلمك الرصاص! ✏️'},
{s:'Cl',n:'الكلور',m:false,j:'بتاع البيسين! 🏊‍♂️'},
];
let score=0, collected=[], crates=[];
const island=document.getElementById('island');

function spawn(){
island.innerHTML='';
crates=[];
ELS.slice(0,6).forEach((el,i)=>{
const ang=(i/6)*Math.PI*2, r=90+Math.random()*20;
const x=160+Math.cos(ang)*r-32, y=160+Math.sin(ang)*r-32;
const d=document.createElement('div');
d.className='crate'; d.textContent=el.s; d.style.left=x+'px'; d.style.top=y+'px';
d.onclick=()=>openCrate(el,d);
island.appendChild(d);
crates.push(d);
});
}
function openCrate(el,div){
if(div.dataset.open) return;
document.getElementById('md').style.display='flex';
document.getElementById('cd').innerHTML=`
<div style="font-size:32px">${el.m?'🔥':'🌫️'}</div>
<div style="font-size:28px;font-weight:900;margin:6px 0">${el.s} - ${el.n}</div>
<div style="background:#fff1;border-radius:10px;padding:8px;font-size:12px">${el.j}</div>
<div style="margin-top:12px;background:#0008;border-radius:10px;padding:10px">
<div style="font-size:11px;opacity:.7">لو ضربته بالشاكوش هيحصل ايه؟</div>
<div style="display:flex;gap:8px;margin-top:8px">
<button onclick="quick('bend')" style="flex:1;height:36px;border-radius:8px;background:#fff1;border:none;color:#fff">ينثني 😎</button>
<button onclick="quick('break')" style="flex:1;height:36px;border-radius:8px;background:#fff1;border:none;color:#fff">يتكسر 💥</button>
</div>
<div id="hint" style="margin-top:8px;font-size:11px;min-height:18px"></div>
</div>
<button onclick="ans(true)" class="btn" style="background:#ffb86a;color:#000">⚔️ فلز جامد</button>
<button onclick="ans(false)" class="btn" style="background:#7ef9ff;color:#000">🛡️ مش فلز (لا فلز)</button>
`;
window.currentEl=el; window.currentDiv=div;
window.quick=(t)=>{
const isBend=t==='bend';
document.getElementById('hint').innerHTML=(isBend===el.m)?'✅ صح! الفلز بينثني':'❌ لا، اللافلز بيتكسر';
};
window.ans=(isMetal)=>{
const ok=isMetal===currentEl.m;
if(ok){
score+=20; collected.push(currentEl.s);
currentDiv.style.background='#39ff14'; currentDiv.textContent='✅';
currentDiv.dataset.open=1;
confetti();
document.getElementById('md').innerHTML=`<div class="card"><div style="font-size:40px">🎉</div><h2>عاش يا بطل!</h2><p style="font-size:13px;margin-top:6px">نهبت ${currentEl.n} الأسطوري!</p><p style="font-size:11px;opacity:.6">${currentEl.j}</p><button class="btn" style="background:#fff;color:#000;margin-top:12px" onclick="closeM()">كمل لوت 🔫</button></div>`;
setTimeout(closeM,1200);
} else {
document.getElementById('hint').innerHTML=`😜 لا يا نوب! ده ${currentEl.m?'فلز':'لا فلز'} - جرب تاني`;
navigator.vibrate&&navigator.vibrate(100);
}
document.getElementById('sc').textContent=score;
document.getElementById('cnt').textContent=collected.length+'/6';
if(collected.length>=6){ setTimeout(()=>{ alert('🏆 WINNER WINNER CHICKEN DINNER! 🍗\nجمعت: '+collected.join(', ')); location.reload(); },800); }
};
}
function closeM(){ document.getElementById('md').style.display='none'; document.getElementById('md').innerHTML='<div class="card" id="cd"></div>'; }
window.closeM=closeM;
function confetti(){
for(let i=0;i<20;i++){
const c=document.createElement('div'); c.className='confetti';
c.style.left=Math.random()*100+'vw'; c.style.background=['#F2A900','#39ff14','#ff4757','#70a1ff'][Math.floor(Math.random()*4)];
c.style.animation=`fall ${0.8+Math.random()*0.8}s linear`; c.style.transform=`rotate(${Math.random()*360}deg)`;
document.body.appendChild(c); setTimeout(()=>c.remove(),1200);
}
}
const style=document.createElement('style'); style.textContent='@keyframes fall{to{transform:translateY(100vh) rotate(720deg)}}'; document.head.appendChild(style);
spawn();
document.getElementById('md').addEventListener('click',e=>{ if(e.target.id==='md') closeM(); });
</script>
</body>
</html>
