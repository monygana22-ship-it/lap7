<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>معركة العناصر - جوه ببجي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0e18;overflow:hidden;touch-action:none;user-select:none}
#gameCanvas{position:fixed;inset:0;width:100vw;height:100vh;background:radial-gradient(120% 80% at 50% -10%,#1e3a5a 0%,#0a0e18 70%)}
.hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.hud>*{pointer-events:auto}
.logo{position:absolute;top:12px;left:12px;width:88px;height:88px;background:radial-gradient(circle,#fff2,#000);border:2px solid #F2A900;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px #F2A90088, inset 0 0 20px #000}
.logo span{font-family:'Orbitron';font-weight:900;font-size:11px;line-height:1;text-align:center;color:#F2A900}
.topbar{position:absolute;top:12px;left:110px;right:12px;height:56px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.1);border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;backdrop-filter:blur(10px)}
.health{width:120px;height:10px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}
.health>div{height:100%;background:linear-gradient(90deg,#39ff14,#facc15);transition:width .3s}
.minimap{position:absolute;top:80px;right:12px;width:150px;height:150px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden}
.joystick{position:absolute;bottom:18px;left:18px;width:120px;height:120px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center}
.stick{width:56px;height:56px;background:radial-gradient(circle at 30% 30%,#fff,#999);border-radius:50%;box-shadow:0 4px 12px #0008;touch-action:none}
.btns{position:absolute;bottom:18px;right:18px;display:flex;gap:8px;flex-direction:column}
.btn{width:72px;height:44px;border-radius:12px;border:none;font-weight:900;font-size:12px;cursor:pointer}
.crateModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;background:linear-gradient(180deg,#1c253a,#141928);border:2px solid #F2A900;border-radius:20px;padding:16px;box-shadow:0 0 60px #F2A90044;text-align:center;animation:pop .3s}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.dragArea{display:flex;gap:10px;margin-top:12px}
.drop{flex:1;height:84px;border:2px dashed rgba(255,255,255,.15);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.drop.metal{border-color:#ff8c42;background:rgba(255,107,53,.1)}
.drop.non{border-color:#4ee2ff;background:rgba(78,226,255,.1)}
.elem{width:86px;height:86px;margin:12px auto;background:radial-gradient(circle at 30% 30%,#fff,#cbd5e1);border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-weight:900;font-size:28px;color:#000;cursor:grab;box-shadow:0 8px 20px #0006}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="hud">
<div class="logo"><span>Fe<br>VS<br>O<br><small style="font-size:7px;color:#fff">BATTLEGROUNDS</small></span></div>
<div class="topbar">
<div style="display:flex;gap:10px;align-items:center"><span style="font-weight:900">❤️ <b id="hpTxt">100</b>%</span><span>🛡️ <b id="shTxt">0</b></span><span>⭐ <b id="scTxt">0</b></span><div class="health"><div id="hpBar" style="width:100%"></div></div></div>
<div><button onclick="toggleMute()" id="muteBtn" style="background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:8px;padding:6px 10px">🔊</button> <span id="cnt" style="font-size:11px;opacity:.6">0/8</span></div>
</div>
<div class="minimap"><canvas id="mini" width="150" height="150"></canvas></div>
<div class="joystick" id="joy"><div class="stick" id="stick"></div></div>
<div class="btns"><button class="btn" style="background:#fff;color:#000" onclick="centerPlayer()">📍 تمركز</button><button class="btn" style="background:#F2A900;color:#000" onclick="toggleMusic()">🎵 موسيقى</button></div>
</div>
<div class="crateModal" id="modal">
<div class="card" id="crateCard"></div>
</div>
<script>
let actx,master,muted=false,lobby=false,oscL;
function aInit(){ if(actx) return; actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=muted?0:.35; master.connect(actx.destination); }
function aCorrect(){ aInit(); [523,659,784,1046].forEach((f,i)=>{ const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; g.gain.setValueAtTime(0,actx.currentTime+i*.08); g.gain.linearRampToValueAtTime(.28,actx.currentTime+i*.08+.05); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+i*.08+.9); o.connect(g); g.connect(master); o.start(actx.currentTime+i*.08); o.stop(actx.currentTime+i*.08+1); }); }
function aWrong(){ aInit(); const o=actx.createOscillator(),g=actx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(220,actx.currentTime); o.frequency.exponentialRampToValueAtTime(80,actx.currentTime+.5); g.gain.setValueAtTime(.5,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6); o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime+.6); }
function toggleMute(){ muted=!muted; if(master) master.gain.value=muted?0:.35; document.getElementById('muteBtn').textContent=muted?'🔇':'🔊'; }
function toggleMusic(){ aInit(); if(lobby){ if(oscL){ try{oscL.stop()}catch{} } lobby=false; return; } lobby=true; oscL=actx.createOscillator(); const g=actx.createGain(); oscL.type='sawtooth'; oscL.frequency.value=55; g.gain.value=.08; oscL.connect(g); g.connect(master); oscL.start(); setInterval(()=>{ if(!lobby||muted) return; const k=actx.createOscillator(),kg=actx.createGain(); k.frequency.setValueAtTime(60,actx.currentTime); k.frequency.exponentialRampToValueAtTime(.01,actx.currentTime+.15); kg.gain.setValueAtTime(.5,actx.currentTime); kg.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.2); k.connect(kg); kg.connect(master); k.start(); k.stop(actx.currentTime+.2); },666); }
const MAP=3000, cvs=document.getElementById('gameCanvas'), ctx=cvs.getContext('2d');
const mini=document.getElementById('mini'), mctx=mini.getContext('2d');
function resize(){ cvs.width=innerWidth*devicePixelRatio; cvs.height=innerHeight*devicePixelRatio; cvs.style.width=innerWidth+'px'; cvs.style.height=innerHeight+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
resize(); addEventListener('resize',resize);
let player={x:1500,y:1500,vx:0,vy:0,hp:100,shield:0,score:0,collected:[]};
const ELEMENTS=[
{s:'Fe',n:'الحديد',m:true,desc:'لامع - ينجذب للمغناطيس - موصل',color:'#ff8c42'},
{s:'Al',n:'الألومنيوم',m:true,desc:'خفيف - يلمع - هيكل طائرات',color:'#d1d5db'},
{s:'Cu',n:'النحاس',m:true,desc:'أحمر - موصل ممتاز - أسلاك',color:'#fb923c'},
{s:'Na',n:'الصوديوم',m:true,desc:'لين يقطع بالسكين - يتفاعل مع الماء',color:'#e2e8f0'},
{s:'Au',n:'الذهب',m:true,desc:'ثمين لا يصدأ - حلي',color:'#facc15'},
{s:'S',n:'الكبريت',m:false,desc:'أصفر هش - لا يوصل',color:'#facc15'},
{s:'O',n:'الأكسجين',m:false,desc:'غاز نتنفسه - 21% من الهواء',color:'#38bdf8'},
{s:'C',n:'الكربون',m:false,desc:'فحم/ألماس - هش',color:'#52525b'},
{s:'Cl',n:'الكلور',m:false,desc:'غاز سام - تعقيم مسابح',color:'#4ade80'},
{s:'N',n:'النيتروجين',m:false,desc:'78% من الهواء - أكياس شيبسي',color:'#818cf8'},
];
let crates=ELEMENTS.map((el,i)=>({x:300+Math.random()*(MAP-600),y:300+Math.random()*(MAP-600),el,opened:false,glow:Math.random()*Math.PI*2}));
let keys={}, joy={x:0,y:0,active:false}, cam={x:1500,y:1500};
let zone={x:1500,y:1500,r:1400,shrink:0.12};
let inCrate=false, currentCrate=null;
function update(){
if(inCrate) return;
let mx=0,my=0;
if(keys['w']||keys['ArrowUp']) my=-1; if(keys['s']||keys['ArrowDown']) my=1;
if(keys['a']||keys['ArrowLeft']) mx=-1; if(keys['d']||keys['ArrowRight']) mx=1;
mx+=joy.x; my+=joy.y;
const len=Math.hypot(mx,my)||1; if(len>0.1){ mx/=len; my/=len; player.vx=mx*4; player.vy=my*4; } else { player.vx*=0.85; player.vy*=0.85; }
player.x=Math.max(0,Math.min(MAP,player.x+player.vx)); player.y=Math.max(0,Math.min(MAP,player.y+player.vy));
cam.x+=(player.x-cam.x)*0.08; cam.y+=(player.y-cam.y)*0.08;
zone.r=Math.max(200,zone.r-zone.shrink);
const dx=player.x-zone.x, dy=player.y-zone.y; if(Math.hypot(dx,dy)>zone.r){ player.hp=Math.max(0,player.hp-0.15); if(player.hp<=0) gameOver(); }
crates.forEach(c=>{ if(!c.opened && Math.hypot(player.x-c.x,player.y-c.y)<90) openCrate(c); c.glow+=0.08; });
document.getElementById('hpTxt').textContent=Math.round(player.hp); document.getElementById('shTxt').textContent=player.shield; document.getElementById('scTxt').textContent=player.score; document.getElementById('hpBar').style.width=player.hp+'%'; document.getElementById('cnt').textContent=player.collected.length+'/8';
}
function draw(){
ctx.clearRect(0,0,innerWidth,innerHeight);
const ox=innerWidth/2-cam.x, oy=innerHeight/2-cam.y;
ctx.fillStyle='#0f1a2e'; ctx.fillRect(ox,oy,MAP,MAP);
for(let i=0;i<4;i++){ for(let j=0;j<4;j++){ ctx.fillStyle=i%2==0?'#122040':'#0f1d35'; if((i+j)%2==0) ctx.fillStyle='#101e38'; ctx.fillRect(ox+i*750,oy+j*750,750,750); ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.strokeRect(ox+i*750,oy+j*750,750,750); } }
ctx.beginPath(); ctx.arc(zone.x+ox,zone.y+oy,zone.r,0,Math.PI*2); ctx.strokeStyle='rgba(239,68,68,.6)'; ctx.lineWidth=3; ctx.setLineDash([12,8]); ctx.stroke(); ctx.setLineDash([]);
crates.forEach(c=>{
if(c.opened) return;
const x=c.x+ox, y=c.y+oy;
const g=Math.sin(c.glow)*0.3+0.7;
ctx.fillStyle=`rgba(242,169,0,${g})`; ctx.fillRect(x-16,y-16,32,32);
ctx.fillStyle='#F2A900'; ctx.fillRect(x-14,y-14,28,28);
ctx.fillStyle='#000'; ctx.font='bold 14px Orbitron'; ctx.fillText(c.el.s,x-10,y+5);
ctx.shadowColor='#F2A900'; ctx.shadowBlur=20; ctx.fillRect(x-2,y-30,4,20); ctx.shadowBlur=0;
});
const px=player.x+ox, py=player.y+oy;
ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,14,0,Math.PI*2); ctx.fill();
ctx.fillStyle='#F2A900'; ctx.beginPath(); ctx.arc(px,py,10,0,Math.PI*2); ctx.fill();
ctx.fillStyle='#000'; ctx.font='900 9px Orbitron'; ctx.fillText('YOU',px-12,py-18);
mctx.clearRect(0,0,150,150); mctx.fillStyle='#0a0e18'; mctx.fillRect(0,0,150,150);
mctx.strokeStyle='rgba(239,68,68,.6)'; mctx.beginPath(); mctx.arc(zone.x/MAP*150,zone.y/MAP*150,zone.r/MAP*150,0,Math.PI*2); mctx.stroke();
crates.forEach(c=>{ if(c.opened) return; mctx.fillStyle='#F2A900'; mctx.fillRect(c.x/MAP*150-2,c.y/MAP*150-2,4,4); });
mctx.fillStyle='#fff'; mctx.beginPath(); mctx.arc(player.x/MAP*150,player.y/MAP*150,4,0,Math.PI*2); mctx.fill();
}
function openCrate(c){
inCrate=true; currentCrate=c;
const m=document.getElementById('modal'); m.style.display='flex';
document.getElementById('crateCard').innerHTML=`
<div style="font-size:10px;letter-spacing:.3em;color:#F2A900;font-weight:900">AIR DROP - ZONE ${c.el.s}</div>
<div class="elem" id="dragElem" draggable="true" style="background:${c.el.color}">${c.el.s}</div>
<div style="font-weight:900">${c.el.n} - ${c.el.s}</div>
<div style="font-size:11px;opacity:.6;margin-top:4px">${c.el.desc}</div>
<div style="margin-top:10px;display:flex;gap:6px">
<button onclick="testHammer()" style="flex:1;height:36px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:900">🔨 اختبر بالمطرقة</button>
<button onclick="testLight()" style="flex:1;height:36px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:900">💡 اختبر التوصيل</button>
</div>
<div id="testRes" style="margin-top:8px;font-size:11px;min-height:18px"></div>
<div class="dragArea">
<div class="drop metal" id="dropMetal" ondrop="drop(event,true)" ondragover="allow(event)">🔥<br>فرن الفلزات<br><small>لامع موصل قابل للطرق</small></div>
<div class="drop non" id="dropNon" ondrop="drop(event,false)" ondragover="allow(event)">🌫️<br>فراغ اللافلزات<br><small>هش عازل غير لامع</small></div>
</div>
<div style="margin-top:8px;font-size:10px;opacity:.4">اسحب العنصر للمكان الصح</div>
`;
}
function allow(e){ e.preventDefault(); }
function testHammer(){
const el=currentCrate.el;
document.getElementById('testRes').innerHTML=el.m?'🔨 انثنى ولم يتكسر = <b style="color:#ff8c42">فلز!</b>':'🔨 تفتت لقطع = <b style="color:#4ee2ff">لا فلز!</b>';
}
function testLight(){
const el=currentCrate.el;
document.getElementById('testRes').innerHTML=el.m?'💡 اللمبة نورت! = <b style="color:#ff8c42">فلز!</b>':'💡 ما نورتش = <b style="color:#4ee2ff">عازل = لا فلز!</b>';
}
function drop(e,isMetal){
e.preventDefault();
const ok=isMetal===currentCrate.el.m;
if(ok){ aCorrect(); player.score+=20; player.shield+=10; player.collected.push(currentCrate.el.s); currentCrate.opened=true; document.getElementById('modal').style.display='none'; inCrate=false; if(player.collected.length>=8) win(); }
else { aWrong(); player.hp=Math.max(0,player.hp-15); document.getElementById('testRes').innerHTML=`<span style="color:#ef4444">❌ غلط! الصح: ${currentCrate.el.m?'فلز':'لا فلز'}</span>`; setTimeout(()=>{ document.getElementById('modal').style.display='none'; inCrate=false; },1200); }
}
function win(){ alert(`🏆 WINNER WINNER!\nجمعت: ${player.collected.join(', ')}\nالنقاط: ${player.score}`); location.reload(); }
function gameOver(){ alert('💀 تم اقصاؤك!'); location.reload(); }
function centerPlayer(){ cam.x=player.x; cam.y=player.y; }
addEventListener('keydown',e=>{ keys[e.key]=true; });
addEventListener('keyup',e=>keys[e.key]=false);
const joyEl=document.getElementById('joy'), stick=document.getElementById('stick');
let md=false; joyEl.addEventListener('mousedown',()=>md=true); addEventListener('mousemove',e=>{ if(!md) return; const rect=joyEl.getBoundingClientRect(); let x=e.clientX-(rect.left+60), y=e.clientY-(rect.top+60); const d=Math.hypot(x,y); const max=40; if(d>max){ x=x/d*max; y=y/d*max; } stick.style.transform=`translate(${x}px,${y}px)`; joy.x=x/max; joy.y=y/max; }); addEventListener('mouseup',()=>{ md=false; joy.x=0; joy.y=0; stick.style.transform='translate(0,0)'; });
function loop(){ update(); draw(); requestAnimationFrame(loop); } loop();
</script>
</body>
</html>
