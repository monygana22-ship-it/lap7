<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معركة العناصر - PUBG Style</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#0a0e18;color:#fff;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% -10%, #1e2f4a 0%, #0a0e18 60%), linear-gradient(180deg,#0f1628,#060a12)}
.hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(0,0,0,.6);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.card{max-width:560px;margin:16px auto;background:rgba(20,25,40,.9);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px;box-shadow:0 0 40px rgba(0,0,0,.6)}
.btn{width:100%;height:54px;border-radius:14px;border:none;font-weight:900;font-size:16px;cursor:pointer;transition:.15s}
.btn-metal{background:linear-gradient(180deg,#ffb86a,#ff6b35);color:#000}
.btn-non{background:linear-gradient(180deg,#7ef9ff,#00d1ff);color:#001a1f}
.btn:hover{transform:scale(1.02)}
.health{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.health>div{height:100%;background:linear-gradient(90deg,#39ff14,#facc15);transition:width.4s}
.zone{height:6px;background:rgba(239,68,68,.2);border-radius:999px;overflow:hidden;margin-top:6px}
.zone>div{height:100%;background:#ef4444;transition:width.5s}
.ele{font-family:'Orbitron';font-size:42px;font-weight:900;letter-spacing:.05em}
.opt{margin-top:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;cursor:pointer}
.opt:hover{background:rgba(255,255,255,.1)}
.correct{border-color:#39ff14!important;background:rgba(57,255,20,.15)!important}
.wrong{border-color:#ef4444!important;background:rgba(239,68,68,.15)!important;animation:shake.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.badge{display:inline-flex;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:11px;font-weight:800;margin:2px}
.start-bg{background:radial-gradient(80% 60% at 50% 0%, rgba(242,169,0,.15), transparent), #0a0e18;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
</style>
</head>
<body>
<div class="bg"></div>
<div id="app"></div>
<script>
let ctx, master, muted=false, lobbyInt=null;
function initAudio(){
 if(ctx) return;
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 master=ctx.createGain(); master.gain.value=muted?0:0.35; master.connect(ctx.destination);
}
function playClick(){
 if(muted) return; initAudio();
 const o=ctx.createOscillator(), g=ctx.createGain();
 o.frequency.setValueAtTime(880,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(1200,ctx.currentTime+0.08);
 g.gain.setValueAtTime(0.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.15);
 o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+0.16);
}
function playCorrect(){
 if(muted) return; initAudio();
 [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
  const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
  o.type='sine'; o2.type='triangle';
  o.frequency.value=f; o2.frequency.value=f*2;
  g.gain.setValueAtTime(0.0001,ctx.currentTime+i*0.08);
  g.gain.linearRampToValueAtTime(0.22,ctx.currentTime+i*0.08+0.04);
  g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+i*0.08+0.9);
  o.connect(g); o2.connect(g); g.connect(master);
  o.start(ctx.currentTime+i*0.08); o2.start(ctx.currentTime+i*0.08);
  o.stop(ctx.currentTime+i*0.08+1); o2.stop(ctx.currentTime+i*0.08+1);
 });
}
function playWrong(){
 if(muted) return; initAudio();
 const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
 o.type='sawtooth'; o.frequency.setValueAtTime(220,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(90,ctx.currentTime+0.5);
 f.type='lowpass'; f.frequency.value=900;
 g.gain.setValueAtTime(0.4,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.6);
 o.connect(f); f.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+0.6);
}
function toggleLobby(){
 initAudio();
 if(lobbyInt){ clearInterval(lobbyInt); lobbyInt=null; return false; }
 const drone=ctx.createOscillator(), dg=ctx.createGain();
 drone.type='sawtooth'; drone.frequency.value=55; dg.gain.value=0.08; drone.connect(dg); dg.connect(master); drone.start();
 let kickInt=setInterval(()=>{
  if(muted) return;
  const k=ctx.createOscillator(), kg=ctx.createGain();
  k.frequency.setValueAtTime(60,ctx.currentTime); k.frequency.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.15);
  kg.gain.setValueAtTime(0.5,ctx.currentTime); kg.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.2);
  k.connect(kg); kg.connect(master); k.start(); k.stop(ctx.currentTime+0.2);
 }, 666);
 lobbyInt=kickInt;
 return true;
}
const Q=[
 {sym:'Fe',name:'الحديد',isMetal:true,q:'الحديد Fe - لامع، موصل، قابل للطرق. هل هو فلز؟',hint:'يُصنع منه حديد التسليح'},
 {sym:'S',name:'الكبريت',isMetal:false,q:'الكبريت S - أصفر هش لا يوصل الكهرباء. هل هو فلز؟',hint:'يوجد قرب البراكين'},
 {sym:'Al',name:'الألومنيوم',isMetal:true,q:'الألومنيوم Al - خفيف لامع في الطائرات. فلز؟',hint:'علب الكولا مصنوعة منه'},
 {sym:'O',name:'الأكسجين',isMetal:false,q:'الأكسجين O - غاز نتنفسه. فلز؟',hint:'21% من الهواء'},
 {sym:'Cu',name:'النحاس',isMetal:true,q:'النحاس Cu - أحمر موصل ممتاز. فلز؟',hint:'أسلاك الكهرباء'},
 {sym:'C',name:'الكربون',isMetal:false,q:'الكربون C - فحم / ألماس هش. فلز؟',hint:'قلم الرصاص'},
 {sym:'Na',name:'الصوديوم',isMetal:true,q:'الصوديوم Na - لين يُقطع بالسكين. فلز؟',hint:'يُحفظ تحت الزيت'},
 {sym:'Cl',name:'الكلور',isMetal:false,q:'الكلور Cl - غاز سام للمسابح. فلز؟',hint:'تعقيم المياه'},
 {sym:'Au',name:'الذهب',isMetal:true,q:'أي فلز ثمين لا يصدأ للحُلي؟',opts:['الذهب Au','الكبريت S','النيتروجين N','الكلور Cl'],ans:0,hint:'أغلى عنصر هنا'},
 {sym:'N',name:'النيتروجين',isMetal:false,q:'النيتروجين N - 78% من الهواء. فلز؟',hint:'أكياس الشيبسي'},
 {sym:'Fe',name:'التوصيل',isMetal:true,q:'أيهما ينقل الحرارة بسرعة؟',opts:['ملعقة حديد Fe','كبريت S','أكسجين O','فحم C'],ans:0,hint:'الفلزات موصلة'},
 {sym:'Cu',name:'السحب',isMetal:true,q:'أي عنصر قابل للسحب لأسلاك؟',opts:['كربون C','نحاس Cu','كبريت S','كلور Cl'],ans:1,hint:'Ductile'},
 {sym:'Al',name:'البريق',isMetal:true,q:'أي عنصر يلمع في الظلام؟',opts:['أكسجين O','ألومنيوم Al','كبريت S','نيتروجين N'],ans:1,hint:'البريق المعدني'},
 {sym:'S',name:'الهشاشة',isMetal:false,q:'ضربته بمطرقة فتفتت.. ماذا يكون؟',opts:['حديد Fe','ذهب Au','كبريت S','نحاس Cu'],ans:2,hint:'اللافلزات هشة'},
 {sym:'Al',name:'الطائرة',isMetal:true,q:'المعركة النهائية! أي فلز لهيكل الطائرة؟',opts:['كربون C','كلور Cl','ألومنيوم Al','كبريت S'],ans:2,hint:'خفيف وقوي'},
];
let idx=0, hp=100, shield=0, score=0, collected=[], answered=false;
function render(){
 const app=document.getElementById('app');
 if(idx>=Q.length){
  const share=`🏆 ناجي معركة العناصر PUBG!\nالنقاط: ${score} - الصحة: ${hp}%\nجمعت: ${collected.join(', ')}\n#علوم_اولى_اعدادي #الفلزات_واللافلزات\nجربوها: https://monygana22-ship-it.github.io/lap7/`;
  app.innerHTML=`<div class="start-bg"><div class="card" style="text-align:center;border-color:#F2A900">
   <div style="font-size:10px;letter-spacing:.3em;color:#F2A900;font-weight:900">WINNER WINNER CHICKEN DINNER</div>
   <h1 style="margin:12px 0">🎉 ناجي معركة العناصر<br><span style="color:#F2A900">خبير فلزات</span></h1>
   <div style="background:rgba(242,169,0,.1);border:1px solid rgba(242,169,0,.2);border-radius:12px;padding:12px;margin:12px 0">
    <div style="display:flex;gap:8px;justify-content:center"><div><b style="font-size:20px">${score}</b><div style="font-size:10px;opacity:.5">نقاط</div></div><div><b style="font-size:20px;color:#F2A900">15/15</b><div style="font-size:10px;opacity:.5">معركة</div></div><div><b style="font-size:20px;color:#39ff14">${collected.length}</b><div style="font-size:10px;opacity:.5">عنصر</div></div></div>
    <div style="margin-top:8px">${collected.map(s=>`<span class="badge">${s}</span>`).join('')}</div>
   </div>
   <button class="btn" style="background:#1877F2;color:#fff" onclick="navigator.clipboard.writeText(\`${share}\`);alert('تم النسخ!')">f شارك نتيجتك على فيسبوك</button>
   <button class="btn" style="margin-top:8px;background:rgba(255,255,255,.08);color:#fff" onclick="location.reload()">🔄 العب تاني</button>
  </div></div>`;
  return;
 }
 const q=Q[idx];
 if(idx===0 &&!window.started){
  app.innerHTML=`<div class="start-bg"><div class="card" style="text-align:center">
   <img src="https://i.imgur.com/8Km9tLL.png" style="width:120px" onerror="this.style.display='none'">
   <h1 style="font-size:26px;font-weight:900;margin:16px 0">معركة العناصر<br><span style="color:#F2A900">PUBG STYLE</span></h1>
   <p style="opacity:.7;line-height:1.7">10 طلاب، جزيرة الجدول الدوري، الزون بتقفل!<br>جاوب صح عن الفلزات واللافلزات عشان تعيش.</p>
   <div style="margin:14px 0;display:flex;gap:8px"><button class="btn" style="background:#fff;color:#000" onclick="window.started=true;playClick();render()">🚁 ابدأ الإسقاط</button><button class="btn" style="background:rgba(255,255,255,.08);color:#fff;width:60px" onclick="let on=toggleLobby();this.textContent=on?'🔊':'🔇'">🔇</button></div>
  </div></div>`;
  return;
 }
 const zonePct=100-((idx/Q.length)*70);
 app.innerHTML=`
  <div class="hud">
   <div style="display:flex;gap:10px;align-items:center"><span style="font-weight:900">❤️ ${hp}%</span><span>🛡️ ${shield}</span><span>⭐ ${score}</span></div>
   <div><button onclick="muted=!muted;this.textContent=muted?'🔇':'🔊'" style="background:rgba(255,255,255,.1);border:none;color:#fff;border-radius:8px;padding:6px 10px">🔊</button><span style="font-size:11px;opacity:.6"> ${idx+1}/15</span></div>
  </div>
  <div style="max-width:560px;margin:0 auto;padding:10px">
   <div class="health"><div style="width:${hp}%"></div></div>
   <div class="zone"><div style="width:${zonePct}%"></div></div>
  </div>
  <div class="card" id="qcard">
   <div style="display:flex;justify-content:space-between"><span class="badge">ZONE ${q.sym}</span><span class="badge">${q.isMetal?'فريق الفلزات':'فريق اللافلزات'}</span></div>
   <div style="text-align:center;margin:14px 0"><div class="ele" style="color:${q.isMetal?'#ff8c42':'#4ee2ff'}">${q.sym}</div><div style="opacity:.6">${q.name}</div></div>
   <h2 style="font-size:16px">${q.q}</h2>
   <div style="font-size:12px;opacity:.5;margin:6px 0">💡 ${q.hint}</div>
   <div id="opts">
    ${q.opts? q.opts.map((o,i)=>`<div class="opt" onclick="answer(${i})">${o}</div>`).join('') : `
     <button class="btn btn-metal" style="margin-top:12px" onclick="answerMetal(true)">⚔️ فلز</button>
     <button class="btn btn-non" style="margin-top:8px" onclick="answerMetal(false)">🛡️ لا فلز</button>
    `}
   </div>
   <div id="feedback" style="margin-top:12px"></div>
  </div>
 `;
}
function answerMetal(val){
 if(answered) return; answered=true;
 const q=Q[idx]; const ok=val===q.isMetal;
 const fb=document.getElementById('feedback');
 if(ok){ playCorrect(); score+=20; shield+=10; collected.push(q.sym); fb.innerHTML=`<div style="background:rgba(57,255,20,.15);border:1px solid #39ff14;border-radius:12px;padding:10px">✅ صحيح!</div>`; }
 else { playWrong(); hp=Math.max(0,hp-15); fb.innerHTML=`<div style="background:rgba(239,68,68,.15);border:1px solid #ef4444;border-radius:12px;padding:10px">❌ غلط! الصح: ${q.isMetal?'فلز':'لا فلز'}</div>`; }
 setTimeout(()=>{ idx++; answered=false; if(hp<=0) idx=Q.length; render(); },1200);
}
function answer(i){
 if(answered) return; answered=true;
 const q=Q[idx]; const ok=i===q.ans;
 const fb=document.getElementById('feedback'); const opts=document.querySelectorAll('.opt');
 if(ok){ playCorrect(); score+=20; collected.push(q.sym); opts[i].classList.add('correct'); }
 else { playWrong(); hp=Math.max(0,hp-15); opts[i].classList.add('wrong'); opts[q.ans].classList.add('correct'); }
 setTimeout(()=>{ idx++; answered=false; if(hp<=0) idx=Q.length; render(); },1300);
}
render();
</script>
</body>
</html>
