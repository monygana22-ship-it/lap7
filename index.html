<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>معركة العناصر - خفيفة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#0a0e18;overflow:hidden;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.top{position:absolute;top:8px;left:8px;right:8px;height:48px;background:#000a;border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#fff;font-size:12px;font-weight:900}
.logo{position:absolute;top:64px;left:8px;width:56px;height:56px;background:#000;border:2px solid #F2A900;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#F2A900;font-weight:900;font-size:10px;text-align:center;line-height:1}
.joy{position:absolute;bottom:12px;left:12px;width:90px;height:90px;background:rgba(255,255,255,.08);border-radius:50%}
.stick{width:44px;height:44px;background:#fff;border-radius:50%;position:absolute;top:23px;left:23px}
.mini{position:absolute;top:64px;right:8px;width:96px;height:96px;background:#000a;border-radius:10px;overflow:hidden}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.card{width:100%;max-width:340px;background:#141928;border:2px solid #F2A900;border-radius:16px;padding:14px;text-align:center;color:#fff}
.btn{width:100%;height:44px;border-radius:10px;border:none;font-weight:900;margin-top:6px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
<div class="top"><span>❤️ <b id="hp">100</b> 🛡️ <b id="sh">0</b> ⭐ <b id="sc">0</b></span><span id="cnt">0/6</span><button onclick="muted=!muted" style="background:#fff2;border:none;border-radius:6px;padding:4px 8px;color:#fff">🔊</button></div>
<div class="logo">Fe<br>VS<br>O</div>
<div class="mini"><canvas id="mini" width="96" height="96"></canvas></div>
<div class="joy" id="joy"><div class="stick" id="stk"></div></div>
</div>
<div class="modal" id="md"><div class="card" id="cd"></div></div>
<script>
let muted=false,actx,master;
function aInit(){if(actx) return; actx=new(window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=.25; master.connect(actx.destination);}
function aOk(){if(muted) return; aInit(); const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=800; g.gain.setValueAtTime(.3,actx.currentTime); g.gain.exponentialRampToValueAtTime(.01,actx.currentTime+.3); o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime+.3);}
function aNo(){if(muted) return; aInit(); const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=150; g.gain.setValueAtTime(.4,actx.currentTime); g.gain.exponentialRampToValueAtTime(.01,actx.currentTime+.4); o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime+.4);}

const cv=document.getElementById('cv'),cx=cv.getContext('2d'), MAP=2000;
function rs(){ cv.width=innerWidth; cv.height=innerHeight; } rs(); addEventListener('resize',rs);
let p={x:1000,y:1000,vx:0,vy:0,hp:100,sh:0,sc:0,cl:[]}, cam={x:1000,y:1000}, keys={}, joy={x:0,y:0}, zone={x:1000,y:1000,r:900}, inM=false, cur=null;
const ELS=[{s:'Fe',n:'الحديد',m:true},{s:'Al',n:'الالومنيوم',m:true},{s:'Cu',n:'النحاس',m:true},{s:'S',n:'الكبريت',m:false},{s:'O',n:'الاكسجين',m:false},{s:'C',n:'الكربون',m:false},{s:'Na',n:'الصوديوم',m:true},{s:'Au',n:'الذهب',m:true}];
let cr=ELS.slice(0,6).map((e,i)=>({x:200+Math.random()*1600,y:200+Math.random()*1600,e,op:false}));

function upd(){
if(inM) return;
let mx=(keys['w']||keys['ArrowUp']?-1:0)+(keys['s']||keys['ArrowDown']?1:0);
let my=(keys['a']||keys['ArrowLeft']?-1:0)+(keys['d']||keys['ArrowRight']?1:0);
my=-mx; mx=joy.x*1.5 + (keys['d']?1:0) + (keys['a']?-1:0);
mx=joy.x; my=joy.y;
if(keys['w']) my=-1; if(keys['s']) my=1; if(keys['a']) mx=-1; if(keys['d']) mx=1;
let l=Math.hypot(mx,my); if(l>0.1){ p.vx=mx/l*5; p.vy=my/l*5; } else { p.vx*=0.8; p.vy*=0.8; }
p.x=Math.max(0,Math.min(MAP,p.x+p.vx)); p.y=Math.max(0,Math.min(MAP,p.y+p.vy));
cam.x+=(p.x-cam.x)*0.15; cam.y+=(p.y-cam.y)*0.15;
zone.r=Math.max(150,zone.r-0.08);
if(Math.hypot(p.x-zone.x,p.y-zone.y)>zone.r) p.hp-=0.2;
if(p.hp<=0){ alert('خسرت!'); location.reload(); }
cr.forEach(c=>{ if(!c.op && Math.hypot(p.x-c.x,p.y-c.y)<70) openC(c); });
document.getElementById('hp').textContent=Math.round(p.hp); document.getElementById('sh').textContent=p.sh; document.getElementById('sc').textContent=p.sc; document.getElementById('cnt').textContent=p.cl.length+'/6';
}
function draw(){
cx.fillStyle='#0f1a2e'; cx.fillRect(0,0,cv.width,cv.height);
const ox=cv.width/2-cam.x, oy=cv.height/2-cam.y;
cx.fillStyle='#122040'; cx.fillRect(ox,oy,MAP,MAP);
// zone
cx.strokeStyle='#ef4444aa'; cx.lineWidth=2; cx.beginPath(); cx.arc(zone.x+ox,zone.y+oy,zone.r,0,Math.PI*2); cx.stroke();
// crates - simple
cr.forEach(c=>{
if(c.op) return;
cx.fillStyle='#F2A900'; cx.fillRect(c.x+ox-12,c.y+oy-12,24,24);
cx.fillStyle='#000'; cx.font='bold 12px Arial'; cx.fillText(c.e.s,c.x+ox-8,c.y+oy+4);
});
// player - simple circle
cx.fillStyle='#fff'; cx.beginPath(); cx.arc(p.x+ox,p.y+oy,10,0,Math.PI*2); cx.fill();
cx.fillStyle='#F2A900'; cx.beginPath(); cx.arc(p.x+ox,p.y+oy,7,0,Math.PI*2); cx.fill();
}
function openC(c){
inM=true; cur=c;
const md=document.getElementById('md'); md.style.display='flex';
document.getElementById('cd').innerHTML=`
<div style="color:#F2A900;font-size:10px;font-weight:900">LOOT CRATE - ${c.e.s}</div>
<div style="width:64px;height:64px;margin:10px auto;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:22px">${c.e.s}</div>
<div style="font-weight:900">${c.e.n}</div>
<div style="font-size:11px;opacity:.6;margin-top:4px">اختبر بسرعة: مطرقة ولا موصل؟</div>
<div style="display:flex;gap:6px;margin-top:10px">
<button onclick="tH()" style="flex:1;height:36px;border-radius:8px;background:#fff2;border:1px solid #fff2;color:#fff;font-size:11px">🔨 مطرقة</button>
<button onclick="tL()" style="flex:1;height:36px;border-radius:8px;background:#fff2;border:1px solid #fff2;color:#fff;font-size:11px">💡 لمبة</button>
</div>
<div id="rs" style="margin-top:8px;font-size:11px;min-height:16px"></div>
<button onclick="ans(true)" class="btn" style="background:linear-gradient(#ffb86a,#ff6b35);color:#000">⚔️ فلز</button>
<button onclick="ans(false)" class="btn" style="background:linear-gradient(#7ef9ff,#00d1ff);color:#000">🛡️ لا فلز</button>
`;
}
window.tH=function(){ document.getElementById('rs').innerHTML=cur.e.m?'🔨 انثنى = فلز':'🔨 تفتت = لا فلز'; };
window.tL=function(){ document.getElementById('rs').innerHTML=cur.e.m?'💡 نورت = فلز':'💡 ما نورتش = لا فلز'; };
window.ans=function(v){
const ok=v===cur.e.m;
if(ok){ aOk(); p.sc+=20; p.sh+=5; p.cl.push(cur.e.s); cur.op=true; }
else { aNo(); p.hp=Math.max(0,p.hp-15); }
document.getElementById('md').style.display='none'; inM=false;
if(p.cl.length>=6){ alert('🏆 كسبت! جمعت '+p.cl.join(',')); location.reload(); }
};
addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);
const joyEl=document.getElementById('joy'), stk=document.getElementById('stk');
let dragging=false;
joyEl.addEventListener('touchstart',e=>{ dragging=true; },{passive:false});
addEventListener('touchmove',e=>{
if(!dragging) return;
const t=e.touches[0], r=joyEl.getBoundingClientRect();
let x=t.clientX-(r.left+45), y=t.clientY-(r.top+45);
let d=Math.hypot(x,y), m=30; if(d>m){ x=x/d*m; y=y/d*m; }
stk.style.transform=`translate(${x}px,${y}px)`; joy.x=x/m; joy.y=y/m;
},{passive:false});
addEventListener('touchend',()=>{ dragging=false; joy.x=0; joy.y=0; stk.style.transform='translate(0,0)'; });
joyEl.addEventListener('mousedown',()=>dragging=true);
addEventListener('mousemove',e=>{
if(!dragging||e.touches) return;
const r=joyEl.getBoundingClientRect(); let x=e.clientX-(r.left+45), y=e.clientY-(r.top+45);
let d=Math.hypot(x,y), m=30; if(d>m){ x=x/d*m; y=y/d*m; }
stk.style.transform=`translate(${x}px,${y}px)`; joy.x=x/m; joy.y=y/m;
});
addEventListener('mouseup',()=>{ dragging=false; joy.x=0; joy.y=0; stk.style.transform='translate(0,0)'; });
(function loop(){ upd(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
